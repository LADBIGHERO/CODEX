<path d="M0 190 C300 120, 455 280, 760 210 C1050 145, 1280 115, 1600 170 L1600 900 L0 900Z" fill="#12345A" opacity=".35"/><rect x="82" y="205" width="650" height="465" rx="28" fill="#FFFFFF" opacity=".10" stroke="#5F8AA5"/><rect x="112" y="250" width="8" height="300" fill="#C51F2C"/><text x="152" y="305" font-size="37" fill="#FFFFFF" font-weight="900" text-anchor="start" opacity="1"><tspan x="152" dy="0">党的领导贯穿工程建设、移民安置、</tspan><tspan x="152" dy="49.95">生态保护和运行管理全过程</tspan></text><text x="152" y="455" font-size="25" fill="#D8EEF2" font-weight="500" text-anchor="start" opacity="1"><tspan x="152" dy="0">工程涉及百万级移民安置，是复杂的工程建设任务，</tspan><tspan x="152" dy="33.75">也是系统的社会治理任务。</tspan></text><rect x="820" y="250" width="260" height="150" rx="22" fill="#FFFFFF" opacity=".96" filter="url(#shadow)"/><rect x="820" y="250" width="260" height="8" rx="4" fill="#C51F2C"/><text x="950" y="312" font-size="34" fill="#C51F2C" font-weight="900" text-anchor="middle" opacity="1"><tspan x="950" dy="0">领导</tspan></text><text x="950" y="362" font-size="22" fill="#243B53" font-weight="650" text-anchor="middle" opacity="1"><tspan x="950" dy="0">统一部署</tspan><tspan x="950" dy="29.700000000000003">统筹全局</tspan></text><rect x="1125" y="250" width="260" height="150" rx="22" fill="#FFFFFF" opacity=".96" filter="url(#shadow)"/><rect x="1125" y="250" width="260" height="8" rx="4" fill="#C51F2C"/><text x="1255" y="312" font-size="34" fill="#C51F2C" font-weight="900" text-anchor="middle" opacity="1"><tspan x="1255" dy="0">组织</tspan></text><text x="1255" y="362" font-size="22" fill="#243B53" font-weight="650" text-anchor="middle" opacity="1"><tspan x="1255" dy="0">基层党组织</tspan><tspan x="1255" dy="29.700000000000003">战斗堡垒</tspan></text><rect x="820" y="460" width="260" height="150" rx="22" fill="#FFFFFF" opacity=".96" filter="url(#shadow)"/><rect x="820" y="460" width="260" height="8" rx="4" fill="#C51F2C"/><text x="950" y="522" font-size="34" fill="#C51F2C" font-weight="900" text-anchor="middle" opacity="1"><tspan x="950" dy="0">攻坚</tspan></text><text x="950" y="572" font-size="22" fill="#243B53" font-weight="650" text-anchor="middle" opacity="1"><tspan x="950" dy="0">关键节点</tspan><tspan x="950" dy="29.700000000000003">冲锋在前</tspan></text><rect x="1125" y="460" width="260" height="150" rx="22" fill="#FFFFFF" opacity=".96" filter="url(#shadow)"/><rect x="1125" y="460" width="260" height="8" rx="4" fill="#C51F2C"/><text x="1255" y="522" font-size="34" fill="#C51F2C" font-weight="900" text-anchor="middle" opacity="1"><tspan x="1255" dy="0">担当</tspan></text><text x="1255" y="572" font-size="22" fill="#243B53" font-weight="650" text-anchor="middle" opacity="1"><tspan x="1255" dy="0">党员干部</tspan><tspan x="1255" dy="29.700000000000003">一线作为</tspan></text><text x="800" y="750" font-size="33" fill="#FFFFFF" font-weight="800" text-anchor="middle" opacity="1"><tspan x="800" dy="0">集中力量办大事的制度优势，是工程顺利推进的重要保障</tspan></text></svg>