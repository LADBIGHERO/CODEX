<text x="70" y="70" font-size="18" fill="#627D98" font-weight="600">三峡大坝的历史与现在</text>
<text x="1530" y="70" font-size="16" fill="#627D98" text-anchor="end">08</text>
<text x="70" y="128" font-size="44" fill="#102A43" font-weight="900">今日三峡：现代化运行与长江大保护</text>
<rect x="72" y="150" width="168" height="7" rx="3.5" fill="#C51F2C"/>
<rect x="80" y="190" width="1440" height="245" rx="30" fill="url(#navy)" filter="url(#shadow)"/><text x="800" y="270" font-size="42" fill="#FFFFFF" font-weight="900" text-anchor="middle" opacity="1"><tspan x="800" dy="0">从工程建设转向高质量运行管理</tspan></text><text x="800" y="335" font-size="25" fill="#D8EEF2" font-weight="500" text-anchor="middle" opacity="1"><tspan x="800" dy="0">数字化、智能化调度服务国家能源安全、长江经济带发展和长江大保护</tspan></text><rect x="145" y="520" width="370" height="126" rx="18" fill="#FFFFFF" stroke="#D8E4EC" stroke-width="2"/><rect x="145" y="520" width="370" height="8" rx="4" fill="#C51F2C"/><text x="330.0" y="576" font-size="38" fill="#C51F2C" font-weight="900" text-anchor="middle" opacity="1"><tspan x="330.0" dy="0">1.8万亿kWh+</tspan></text><text x="330.0" y="608" font-size="18" fill="#243B53" font-weight="700" text-anchor="middle" opacity="1"><tspan x="330.0" dy="0">截至2025年8月累计发电量突破</tspan></text><rect x="615" y="520" width="370" height="126" rx="18" fill="#FFFFFF" stroke="#D8E4EC" stroke-width="2"/><rect x="615" y="520" width="370" height="8" rx="4" fill="#1E7F86"/><text x="800.0" y="576" font-size="38" fill="#1E7F86" font-weight="900" text-anchor="middle" opacity="1"><tspan x="800.0" dy="0">22亿吨+</tspan></text><text x="800.0" y="608" font-size="18" fill="#243B53" font-weight="700" text-anchor="middle" opacity="1"><tspan x="800.0" dy="0">三峡船闸累计货运量超过</tspan></text><rect x="1085" y="520" width="370" height="126" rx="18" fill="#FFFFFF" stroke="#D8E4EC" stroke-width="2"/><rect x="1085" y="520" width="370" height="8" rx="4" fill="#1E7F86"/><text x="1270.0" y="576" font-size="38" fill="#1E7F86" font-weight="900" text-anchor="middle" opacity="1"><tspan x="1270.0" dy="0">2003年以来</tspan></text><text x="1270.0" y="608" font-size="18" fill="#243B53" font-weight="700" text-anchor="middle" opacity="1"><tspan x="1270.0" dy="0">首批机组投产、永久船闸通航</tspan></text><path d="M200 470 H1400" stroke="#D8E4EC" stroke-width="2" stroke-dasharray="8 10"/></svg>