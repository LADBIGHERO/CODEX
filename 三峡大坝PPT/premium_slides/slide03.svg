<text x="70" y="70" font-size="18" fill="#627D98" font-weight="600">三峡大坝的历史与现在</text>
<text x="1530" y="70" font-size="16" fill="#627D98" text-anchor="end">03</text>
<text x="70" y="128" font-size="44" fill="#102A43" font-weight="900">百年构想：从设想到国家决策</text>
<rect x="72" y="150" width="168" height="7" rx="3.5" fill="#C51F2C"/>
<rect x="0" y="0" width="1600" height="900" fill="url(#grid)" opacity=".45"/><rect x="105" y="250" width="300" height="260" rx="24" fill="#FFFFFF" filter="url(#shadow)"/><circle cx="255" cy="250" r="43" fill="#1E7F86"/><text x="255" y="260" font-size="34" fill="#FFFFFF" font-weight="900" text-anchor="middle" opacity="1"><tspan x="255" dy="0">1</tspan></text><text x="255" y="345" font-size="31" fill="#12345A" font-weight="900" text-anchor="middle" opacity="1"><tspan x="255" dy="0">早期设想</tspan></text><text x="255" y="415" font-size="21" fill="#334E68" font-weight="500" text-anchor="middle" opacity="1"><tspan x="255" dy="0">围绕长江治水与水能开发</tspan><tspan x="255" dy="28.35">形成三峡工程构想</tspan></text><path d="M417 375 H470" stroke="#9FB3C8" stroke-width="5" stroke-linecap="round"/><path d="M463 363 L483 375 L463 387" fill="none" stroke="#9FB3C8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="475" y="250" width="300" height="260" rx="24" fill="#FFFFFF" filter="url(#shadow)"/><circle cx="625" cy="250" r="43" fill="#1E7F86"/><text x="625" y="260" font-size="34" fill="#FFFFFF" font-weight="900" text-anchor="middle" opacity="1"><tspan x="625" dy="0">2</tspan></text><text x="625" y="345" font-size="31" fill="#12345A" font-weight="900" text-anchor="middle" opacity="1"><tspan x="625" dy="0">系统论证</tspan></text><text x="625" y="415" font-size="21" fill="#334E68" font-weight="500" text-anchor="middle" opacity="1"><tspan x="625" dy="0">新中国成立后持续开展</tspan><tspan x="625" dy="28.35">勘测、规划与科学研究</tspan></text><path d="M787 375 H840" stroke="#9FB3C8" stroke-width="5" stroke-linecap="round"/><path d="M833 363 L853 375 L833 387" fill="none" stroke="#9FB3C8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="845" y="250" width="300" height="260" rx="24" fill="#FFFFFF" filter="url(#shadow)"/><circle cx="995" cy="250" r="43" fill="#C51F2C"/><text x="995" y="260" font-size="34" fill="#FFFFFF" font-weight="900" text-anchor="middle" opacity="1"><tspan x="995" dy="0">3</tspan></text><text x="995" y="345" font-size="31" fill="#12345A" font-weight="900" text-anchor="middle" opacity="1"><tspan x="995" dy="0">国家决策</tspan></text><text x="995" y="415" font-size="21" fill="#334E68" font-weight="500" text-anchor="middle" opacity="1"><tspan x="995" dy="0">1992年全国人大审议通过</tspan><tspan x="995" dy="28.35">兴建三峡工程决议</tspan></text><path d="M1157 375 H1210" stroke="#9FB3C8" stroke-width="5" stroke-linecap="round"/><path d="M1203 363 L1223 375 L1203 387" fill="none" stroke="#9FB3C8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="1215" y="250" width="300" height="260" rx="24" fill="#FFFFFF" filter="url(#shadow)"/><circle cx="1365" cy="250" r="43" fill="#C51F2C"/><text x="1365" y="260" font-size="34" fill="#FFFFFF" font-weight="900" text-anchor="middle" opacity="1"><tspan x="1365" dy="0">4</tspan></text><text x="1365" y="345" font-size="31" fill="#12345A" font-weight="900" text-anchor="middle" opacity="1"><tspan x="1365" dy="0">正式开工</tspan></text><text x="1365" y="415" font-size="21" fill="#334E68" font-weight="500" text-anchor="middle" opacity="1"><tspan x="1365" dy="0">1994年工程正式开工</tspan><tspan x="1365" dy="28.35">百年构想进入实施阶段</tspan></text><rect x="210" y="610" width="1180" height="88" rx="18" fill="#12345A"/><text x="800" y="665" font-size="30" fill="#FFFFFF" font-weight="800" text-anchor="middle" opacity="1"><tspan x="800" dy="0">体现党和国家对重大工程、重大民生、重大安全问题的长期谋划能力</tspan></text></svg>