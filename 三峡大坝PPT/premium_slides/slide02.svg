<text x="1530" y="70" font-size="16" fill="#627D98" text-anchor="end">02</text>
<text x="70" y="128" font-size="44" fill="#102A43" font-weight="900">一江安澜：建设的时代背景</text>
<rect x="72" y="150" width="168" height="7" rx="3.5" fill="#C51F2C"/>
<rect x="70" y="195" width="620" height="430" rx="22" fill="#FFFFFF" filter="url(#shadow)"/><circle cx="112" cy="247" r="6" fill="#1E7F86"/><text x="135" y="255" font-size="25" fill="#243B53" font-weight="600" text-anchor="start" opacity="1"><tspan x="135" dy="0">长江干流全长约6300公里，是我国重要经济轴线</tspan></text><circle cx="112" cy="322" r="6" fill="#1E7F86"/><text x="135" y="330" font-size="25" fill="#243B53" font-weight="600" text-anchor="start" opacity="1"><tspan x="135" dy="0">中下游人口密集、产业集中，防洪安全关系全局</tspan></text><circle cx="112" cy="397" r="6" fill="#1E7F86"/><text x="135" y="405" font-size="25" fill="#243B53" font-weight="600" text-anchor="start" opacity="1"><tspan x="135" dy="0">工程承担防洪、发电、航运、水资源调度等综合任务</tspan></text><circle cx="112" cy="472" r="6" fill="#1E7F86"/><text x="135" y="480" font-size="25" fill="#243B53" font-weight="600" text-anchor="start" opacity="1"><tspan x="135" dy="0">根本出发点是保障人民生命财产安全、服务国家发展大局</tspan></text><rect x="95" y="545" width="155" height="54" rx="10" fill="#C51F2C"/><text x="172.5" y="580.0" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle" opacity="1"><tspan x="172.5" dy="0">防洪安全</tspan></text><rect x="280" y="545" width="155" height="54" rx="10" fill="#1E7F86"/><text x="357.5" y="580.0" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle" opacity="1"><tspan x="357.5" dy="0">清洁能源</tspan></text><rect x="465" y="545" width="155" height="54" rx="10" fill="#12345A"/><text x="542.5" y="580.0" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle" opacity="1"><tspan x="542.5" dy="0">黄金水道</tspan></text><rect x="765" y="180" width="720" height="500" rx="28" fill="#FFFFFF" filter="url(#shadow)"/><text x="1125" y="240" font-size="30" fill="#12345A" font-weight="900" text-anchor="middle" opacity="1"><tspan x="1125" dy="0">长江流域与三峡位置示意</tspan></text><path d="M895 528 C1010 470, 1025 370, 1145 405 C1265 440, 1315 345, 1430 300" fill="none" stroke="#1E7F86" stroke-width="34" stroke-linecap="round"/><path d="M940 540 C1060 515, 1185 580, 1300 520" fill="none" stroke="#67B7BE" stroke-width="10" stroke-linecap="round"/><path d="M1020 430 C1080 405, 1110 405, 1150 410" fill="none" stroke="#67B7BE" stroke-width="8" stroke-linecap="round"/><circle cx="1166" cy="414" r="22" fill="#C51F2C"/><text x="1200" y="423" font-size="25" fill="#102A43" font-weight="800" text-anchor="start" opacity="1"><tspan x="1200" dy="0">三峡坝址</tspan></text><rect x="850" y="600" width="545" height="46" rx="23" fill="#EDF7F8"/><text x="1122" y="631" font-size="23" fill="#1E7F86" font-weight="700" text-anchor="middle" opacity="1"><tspan x="1122" dy="0">上游调蓄　下游防洪　全流域协同</tspan></text></svg>