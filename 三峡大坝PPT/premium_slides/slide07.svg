<rect x="100" y="205" width="620" height="190" rx="18" fill="#FFFFFF" stroke="#D8E4EC" stroke-width="2"/><rect x="100" y="205" width="8" height="190" rx="4" fill="#C51F2C"/><text x="134" y="257" font-size="30" fill="#C51F2C" font-weight="800" text-anchor="start" opacity="1"><tspan x="134" dy="0">防洪</tspan></text><text x="134" y="300" font-size="20" fill="#334E68" font-weight="500" text-anchor="start" opacity="1"><tspan x="134" dy="0">防洪库容约221.5亿立方米</tspan></text><text x="134" y="334" font-size="20" fill="#334E68" font-weight="500" text-anchor="start" opacity="1"><tspan x="134" dy="0">提升长江中下游安全保障</tspan></text><circle cx="635" cy="287" r="48" fill="#C51F2C" opacity=".12"/><circle cx="635" cy="287" r="24" fill="#C51F2C"/><rect x="810" y="205" width="620" height="190" rx="18" fill="#FFFFFF" stroke="#D8E4EC" stroke-width="2"/><rect x="810" y="205" width="8" height="190" rx="4" fill="#1E7F86"/><text x="844" y="257" font-size="30" fill="#1E7F86" font-weight="800" text-anchor="start" opacity="1"><tspan x="844" dy="0">发电</tspan></text><text x="844" y="300" font-size="20" fill="#334E68" font-weight="500" text-anchor="start" opacity="1"><tspan x="844" dy="0">多年平均年发电量约882亿千瓦时</tspan></text><text x="844" y="334" font-size="20" fill="#334E68" font-weight="500" text-anchor="start" opacity="1"><tspan x="844" dy="0">持续输出清洁电能</tspan></text><circle cx="1345" cy="287" r="48" fill="#1E7F86" opacity=".12"/><circle cx="1345" cy="287" r="24" fill="#1E7F86"/><rect x="100" y="455" width="620" height="190" rx="18" fill="#FFFFFF" stroke="#D8E4EC" stroke-width="2"/><rect x="100" y="455" width="8" height="190" rx="4" fill="#12345A"/><text x="134" y="507" font-size="30" fill="#12345A" font-weight="800" text-anchor="start" opacity="1"><tspan x="134" dy="0">航运</tspan></text><text x="134" y="550" font-size="20" fill="#334E68" font-weight="500" text-anchor="start" opacity="1"><tspan x="134" dy="0">双线五级船闸支撑万吨级船队</tspan></text><text x="134" y="584" font-size="20" fill="#334E68" font-weight="500" text-anchor="start" opacity="1"><tspan x="134" dy="0">改善川江航道条件</tspan></text><circle cx="635" cy="537" r="48" fill="#12345A" opacity=".12"/><circle cx="635" cy="537" r="24" fill="#12345A"/><rect x="810" y="455" width="620" height="190" rx="18" fill="#FFFFFF" stroke="#D8E4EC" stroke-width="2"/><rect x="810" y="455" width="8" height="190" rx="4" fill="#617586"/><text x="844" y="507" font-size="30" fill="#617586" font-weight="800" text-anchor="start" opacity="1"><tspan x="844" dy="0">调度</tspan></text><text x="844" y="550" font-size="20" fill="#334E68" font-weight="500" text-anchor="start" opacity="1"><tspan x="844" dy="0">汛期削峰、枯水补水</tspan></text><text x="844" y="584" font-size="20" fill="#334E68" font-weight="500" text-anchor="start" opacity="1"><tspan x="844" dy="0">服务流域水资源配置</tspan></text><circle cx="1345" cy="537" r="48" fill="#617586" opacity=".12"/><circle cx="1345" cy="537" r="24" fill="#617586"/><rect x="420" y="740" width="760" height="60" rx="30" fill="#12345A"/><text x="800" y="781" font-size="27" fill="#FFFFFF" font-weight="800" text-anchor="middle" opacity="1"><tspan x="800" dy="0">一座工程，多重效益，服务流域治理全局</tspan></text></svg>